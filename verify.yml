---
# Read-mostly checks of a deployed cluster plus an RBD write smoke test (image removed afterwards).
- name: Verify Ceph
  hosts: mons[0]
  become: true
  tasks:
    - name: Expected OSD count
      ansible.builtin.set_fact:
        expected_osds: >-
          {% set ns = namespace(n=0) %}{% for h in groups['osds'] %}{% set d = hostvars[h].ceph_osd_devices | default([]) | length %}{% set ns.n = ns.n + (d if d > 0 else 1) %}{% endfor %}{{ ns.n }}

    - name: Status
      ansible.builtin.command: "{{ ceph_shell }} ceph status --format json"
      register: status_json
      changed_when: false

    - name: Health, quorum and OSDs
      ansible.builtin.assert:
        that:
          - s.health.status == 'HEALTH_OK'
          - s.quorum_names | sort == groups['mons'] | sort
          - s.osdmap.num_up_osds | int == expected_osds | int
          - s.osdmap.num_in_osds | int == expected_osds | int
          - s.pgmap.pgs_by_state | rejectattr('state_name', 'equalto', 'active+clean') | list | length == 0
        success_msg: "HEALTH_OK, quorum {{ s.quorum_names | join(',') }}, {{ s.osdmap.num_up_osds }} OSDs up/in, all PGs active+clean"
        fail_msg: "Unhealthy cluster: {{ s.health }}"
      vars:
        s: "{{ status_json.stdout | from_json }}"

    - name: RBD smoke test script
      ansible.builtin.copy:
        dest: "{{ ceph_workdir }}/rbd-smoke.sh"
        mode: "0600"
        content: |
          #!/bin/bash
          set -euo pipefail
          pool={{ (ceph_pools | selectattr('application', 'defined') | selectattr('application', 'equalto', 'rbd') | map(attribute='name') | first) | default('rbd') }}
          image="lab-verify-$(date +%s)"
          trap 'rbd rm "$pool/$image" >/dev/null 2>&1 || true' EXIT
          rbd create "$pool/$image" --size 128M
          rbd bench --io-type write --io-size 4M --io-total 64M "$pool/$image" | tail -n 2
          rbd bench --io-type read --io-size 4M --io-total 64M "$pool/$image" | tail -n 2
          echo "RBD_SMOKE_OK $pool/$image"

    - name: RBD write/read smoke test
      ansible.builtin.command: "{{ ceph_shell }} bash /mnt/lab/rbd-smoke.sh"
      register: smoke
      changed_when: false

    - name: Smoke test output
      ansible.builtin.debug:
        var: smoke.stdout_lines
