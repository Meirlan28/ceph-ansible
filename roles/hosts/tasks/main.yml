---
# Let the cephadm orchestrator reach every host as root, then declare hosts and services in one
# spec file (`ceph orch apply -i`): the orchestrator converges the cluster to it.
- name: cephadm public SSH key
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.pub
  delegate_to: "{{ ceph_bootstrap_host }}"
  run_once: true
  register: ceph_pub

- name: /root/.ssh
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"

- name: Authorize cephadm key for root
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ ceph_pub.content | b64decode | trim }}"
    create: true
    mode: "0600"

- name: OSD devices defined
  ansible.builtin.assert:
    that: ceph_osd_auto or (hostvars[item].ceph_osd_devices | default([]) | length > 0)
    fail_msg: "{{ item }} is in 'osds' but has no ceph_osd_devices (or set ceph_osd_auto: true)"
    quiet: true
  loop: "{{ groups['osds'] }}"
  run_once: true

- name: Cluster spec (hosts, mon, mgr, osd)
  ansible.builtin.template:
    src: cluster-spec.yml.j2
    dest: "{{ ceph_workdir }}/cluster-spec.yml"
    mode: "0600"
  delegate_to: "{{ ceph_bootstrap_host }}"
  run_once: true
  register: spec

- name: Hosts known to the orchestrator
  ansible.builtin.command: "{{ ceph_shell }} ceph orch host ls --format json"
  delegate_to: "{{ ceph_bootstrap_host }}"
  run_once: true
  register: orch_hosts
  changed_when: false

- name: ceph orch apply -i cluster-spec.yml
  ansible.builtin.command: "{{ ceph_shell }} ceph orch apply -i /mnt/lab/cluster-spec.yml"
  delegate_to: "{{ ceph_bootstrap_host }}"
  run_once: true
  when: spec.changed or (orch_hosts.stdout | from_json | map(attribute='hostname') | list | sort) != (ceph_hosts | sort)
