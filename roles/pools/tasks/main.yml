---
- name: Pools script
  ansible.builtin.template:
    src: pools.sh.j2
    dest: "{{ ceph_workdir }}/pools.sh"
    mode: "0600"

- name: Pools and applications (idempotent)
  ansible.builtin.command: "{{ ceph_shell }} bash /mnt/lab/pools.sh"
  register: pools
  changed_when: "'CHANGED' in pools.stdout"

- name: Wait for HEALTH_OK
  ansible.builtin.command: "{{ ceph_shell }} ceph health --format json"
  register: health
  changed_when: false
  retries: "{{ ceph_wait_retries }}"
  delay: "{{ ceph_wait_delay }}"
  until: health.rc == 0 and (health.stdout | from_json).status == 'HEALTH_OK'
  failed_when: false

- name: Health details (cluster not HEALTH_OK)
  ansible.builtin.command: "{{ ceph_shell }} ceph health detail"
  register: health_detail
  changed_when: false
  when: health.rc != 0 or (health.stdout | from_json).status != 'HEALTH_OK'

- name: Cluster must be healthy
  ansible.builtin.fail:
    msg: "{{ health_detail.stdout }}"
  when: health_detail is not skipped
