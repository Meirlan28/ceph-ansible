---
# Role ceph_cluster: day-1 of a cephadm Ceph cluster on top of cephadm-ansible (ceph.cephadm modules).
# Apply it to every storage node (e.g. hosts: ceph); admin-only steps run on admin_node.
# admin_node, cephadm_ssh_user, ceph_release are shared with the upstream cephadm-ansible playbooks
# (preflight, purge), so they keep upstream names; set them in the inventory.

# ---- Admin node and orchestrator access ------------------------------------------------------------
admin_node: "{{ groups['admin'] | first }}" # bootstrap host; better set explicitly
cephadm_ssh_user: "{{ ansible_user | default('root') }}"

# ---- Release ---------------------------------------------------------------------------------------
ceph_release: "20.2.4"
ceph_image: "quay.io/ceph/ceph:v{{ ceph_release }}"

# ---- Per host (host_vars / inventory) --------------------------------------------------------------
ceph_ip: "{{ ansible_host | default(inventory_hostname) }}" # address Ceph daemons bind to
ceph_labels: [] # placement labels: mon, mgr, osd, ...

# ---- Bootstrap -------------------------------------------------------------------------------------
ceph_cluster_network: "" # optional replication network (CIDR)
ceph_monitoring_stack: false # Prometheus/Grafana/Alertmanager
ceph_dashboard_user: admin
# ceph_dashboard_password: required for bootstrap (keep it in ansible-vault)

# ---- Time ------------------------------------------------------------------------------------------
# cluster: ntp_server follows ntp_upstream and serves the other nodes (mons allow 50 ms of drift).
# system:  leave chrony as configured by the OS (e.g. corporate NTP already in place).
ceph_ntp_mode: cluster
ntp_upstream: [pool.ntp.org]
ntp_server: "{{ admin_node }}"
# Who may query ntp_server (chrony "allow": addresses or CIDRs). Default: ceph_ip of every host in
# ceph_inventory_group from the inventory, independent of --limit. Set a subnet to cover future hosts.
ceph_inventory_group: ceph
ntp_allow: "{{ groups[ceph_inventory_group] | default([]) | map('extract', hostvars) | map(attribute='ceph_ip', default='') | select | list }}"
# Fail fast: wait at most ntp_wait_retries x 5 s for a selected source and |offset| < ntp_max_offset (s).
ntp_wait_retries: 12
ntp_max_offset: 0.05

# ---- Desired cluster state: files in the repo, next to the inventory --------------------------------
# <ceph_state_dir>/services/*.yml  cephadm service specs, native format (as `ceph orch ls --export`)
# <ceph_state_dir>/config.yml      ceph config:  <who>: {<option>: <value>}
# <ceph_state_dir>/pools.yml       pools:        <name>: {pg_num: N, application: rbd|cephfs|rgw}
# The variables below just read those files; set a variable in group_vars only to bypass its file.
ceph_state_dir: "{{ inventory_dir }}/ceph"
ceph_service_specs: >-
  {{ query('ansible.builtin.file', *(query('ansible.builtin.fileglob', ceph_state_dir ~ '/services/*.yml') | sort))
     | map('from_yaml_all') | map('list') | flatten(levels=1) | select | list }}
ceph_config: "{{ lookup('ansible.builtin.file', ceph_state_dir ~ '/config.yml') | from_yaml | default({}, true) }}"
ceph_pools: "{{ lookup('ansible.builtin.file', ceph_state_dir ~ '/pools.yml') | from_yaml | default({}, true) }}"
# playbooks/drift.yml: fail (non-zero exit) when the cluster differs from the files.
ceph_drift_fail: true

# ---- Waiting ---------------------------------------------------------------------------------------
# Deployment waits (mon quorum, OSDs up/in, HEALTH_OK after pools): up to retries x delay = 1 min.
ceph_wait_retries: 12
ceph_wait_delay: 5
# Verification wait for HEALTH_OK: 18 x 5 s = 90 s.
ceph_verify_retries: 18
