---
# Register every host of the play with the orchestrator; labels drive placement in the service specs (ceph_state_dir/services),
# _admin (hosts in group "admin") keeps ceph.conf and the admin keyring there.
- name: Ceph orch host add {{ inventory_hostname }}
  ceph.cephadm.ceph_orch_host:
    name: "{{ inventory_hostname }}"
    address: "{{ ceph_ip }}"
    labels: "{{ ceph_labels }}"
    set_admin_label: "{{ inventory_hostname in groups['admin'] | default([admin_node]) }}"
  delegate_to: "{{ admin_node }}"
  throttle: 1
