---
- name: Existing pools
  ansible.builtin.command: ceph osd pool ls --format json
  register: ceph_cluster_pools
  changed_when: false
  when: inventory_hostname == admin_node

- name: Ceph osd pool create {{ item.name }}
  ansible.builtin.command: ceph osd pool create {{ item.name }} {{ item.pg_num | default(32) }}
  loop: "{{ ceph_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname == admin_node and item.name not in (ceph_cluster_pools.stdout | from_json)
  changed_when: true

- name: Pool applications
  ansible.builtin.command: ceph osd pool application get {{ item.name }} --format json
  register: ceph_cluster_apps
  changed_when: false
  loop: "{{ ceph_pools | selectattr('application', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname == admin_node

- name: Enable application (rbd pools are initialised with rbd pool init)
  ansible.builtin.shell: |
    set -e
    ceph osd pool application enable {{ item.item.name }} {{ item.item.application }}
    {% if item.item.application == 'rbd' %}rbd pool init {{ item.item.name }}{% endif %}
  loop: "{{ ceph_cluster_apps.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}={{ item.item.application }}"
  when: inventory_hostname == admin_node and item.item.application not in (item.stdout | from_json)
  changed_when: true

- name: Wait for HEALTH_OK
  ansible.builtin.command: ceph health --format json
  register: ceph_cluster_health
  changed_when: false
  retries: "{{ ceph_wait_retries }}"
  delay: "{{ ceph_wait_delay }}"
  until: ceph_cluster_health.rc == 0 and (ceph_cluster_health.stdout | from_json).status == 'HEALTH_OK'
  when: inventory_hostname == admin_node
