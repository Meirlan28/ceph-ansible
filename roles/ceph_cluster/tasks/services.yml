---
- name: Ceph config set | {{ item.who ~ ' ' ~ item.option ~ '=' ~ item.value }}
  ceph.cephadm.ceph_config:
    action: set
    who: "{{ item.who }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  loop: "{{ ceph_config }}"
  loop_control:
    label: "{{ item.who }} {{ item.option }}={{ item.value }}"
  when: inventory_hostname == admin_node

# Replication (cluster) network. A fresh cluster gets it from bootstrap (--cluster-network); this also
# covers clusters bootstrapped without it. OSDs pick their back address from it only when they start.
- name: Ceph config set global cluster_network
  ceph.cephadm.ceph_config:
    action: set
    who: global
    option: cluster_network
    value: "{{ ceph_cluster_network }}"
  register: ceph_cluster_net_config
  when: inventory_hostname == admin_node and ceph_cluster_network | length > 0

- name: Restart OSD services so they bind to the new cluster network
  ansible.builtin.command: ceph orch restart osd.{{ item.service_id }}
  loop: "{{ ceph_service_specs | selectattr('service_type', 'equalto', 'osd') | list }}"
  loop_control:
    label: "osd.{{ item.service_id }}"
  when: inventory_hostname == admin_node and ceph_cluster_net_config is changed
  changed_when: true

- name: Ceph orch apply {{ item.service_type }}
  ceph.cephadm.ceph_orch_apply:
    spec: "{{ item | to_nice_yaml }}"
  loop: "{{ ceph_service_specs }}"
  loop_control:
    label: "{{ item.service_type }}{{ ('.' ~ item.service_id) if item.service_id is defined else '' }}"
  when: inventory_hostname == admin_node

# The orchestrator deploys daemons asynchronously; wait for the result.
- name: Wait for all mons in quorum
  ansible.builtin.command: ceph quorum_status --format json
  register: ceph_cluster_quorum
  changed_when: false
  retries: "{{ ceph_wait_retries }}"
  delay: "{{ ceph_wait_delay }}"
  until: >-
    ceph_cluster_quorum.rc == 0 and
    (ceph_cluster_quorum.stdout | from_json).quorum_names | length
    == ansible_play_hosts_all | map('extract', hostvars, 'ceph_labels') | select('contains', 'mon') | list | length
  when: inventory_hostname == admin_node

- name: Wait for one OSD per osd-labelled host, all up and in
  ansible.builtin.command: ceph osd stat --format json
  register: ceph_cluster_osd_stat
  changed_when: false
  retries: "{{ ceph_wait_retries }}"
  delay: "{{ ceph_wait_delay }}"
  until: >-
    ceph_cluster_osd_stat.rc == 0 and
    (ceph_cluster_osd_stat.stdout | from_json).num_osds | int
    >= ansible_play_hosts_all | map('extract', hostvars, 'ceph_labels') | select('contains', 'osd') | list | length
    and (ceph_cluster_osd_stat.stdout | from_json).num_up_osds == (ceph_cluster_osd_stat.stdout | from_json).num_osds
    and (ceph_cluster_osd_stat.stdout | from_json).num_in_osds == (ceph_cluster_osd_stat.stdout | from_json).num_osds
  when: inventory_hostname == admin_node
