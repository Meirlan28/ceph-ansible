---
# Every Ceph host: package repo, cephadm + container runtime, time sync, firewall, image.
- name: Supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution_major_version | int >= 9
    fail_msg: "This role supports EL9/EL10 (Alma/Rocky/RHEL); found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"

- name: Ceph {{ ceph_release }} package repository
  ansible.builtin.yum_repository:
    name: ceph-noarch
    description: "Ceph {{ ceph_release }} noarch"
    baseurl: "{{ ceph_repo_url }}/noarch"
    gpgcheck: true
    gpgkey: "{{ ceph_repo_gpgkey }}"

- name: cephadm and runtime dependencies
  ansible.builtin.dnf:
    name:
      - "cephadm-{{ ceph_release }}"
      - podman
      - lvm2
      - chrony
      - python3
    state: present

- name: chrony configuration (bootstrap host serves time to the Ceph hosts)
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    mode: "0644"
    backup: true
  when: ceph_ntp_mode == 'cluster'
  notify: Restart chronyd

- name: NTP service open on the time server
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl is-active --quiet firewalld || { echo inactive; exit 0; }
    if firewall-cmd --permanent --query-service=ntp >/dev/null; then echo present; exit 0; fi
    firewall-cmd --permanent --add-service=ntp >/dev/null && firewall-cmd --reload >/dev/null && echo added
  args:
    executable: /bin/bash
  register: ntp_fw
  changed_when: "'added' in ntp_fw.stdout"
  when: ceph_ntp_mode == 'cluster' and inventory_hostname == ceph_bootstrap_host

- name: chronyd enabled and running
  ansible.builtin.systemd_service:
    name: chronyd
    state: started
    enabled: true

- name: Apply chrony changes now
  ansible.builtin.meta: flush_handlers

- name: Wait until the clock is within 10 ms of its source (monitors allow 50 ms between each other)
  ansible.builtin.command: chronyc waitsync 30 0.01
  register: waitsync
  changed_when: false
  failed_when: false

- name: Clock not synchronised
  ansible.builtin.debug:
    msg: "chrony did not converge on {{ inventory_hostname }}; expect HEALTH_WARN MON_CLOCK_SKEW until it does"
  when: waitsync.rc != 0

- name: Firewall ports (mon, osd/mgr range, dashboard, mgr metrics)
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl is-active --quiet firewalld || { echo inactive; exit 0; }
    changed=0
    for svc in ceph-mon ceph; do
      firewall-cmd --permanent --query-service="$svc" >/dev/null || { firewall-cmd --permanent --add-service="$svc" >/dev/null; changed=1; }
    done
    for port in 8443/tcp 9283/tcp; do
      firewall-cmd --permanent --query-port="$port" >/dev/null || { firewall-cmd --permanent --add-port="$port" >/dev/null; changed=1; }
    done
    [ "$changed" = 0 ] || firewall-cmd --reload >/dev/null
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: firewall
  changed_when: "'changed=1' in firewall.stdout"

- name: Is the Ceph image present
  ansible.builtin.command: podman image exists {{ ceph_image }}
  register: image
  changed_when: false
  failed_when: false

- name: Pull {{ ceph_image }} (about 1.5 GB, first run only)
  ansible.builtin.command: podman pull --quiet {{ ceph_image }}
  when: image.rc != 0
  register: pull
  retries: 3
  delay: 15
  until: pull.rc == 0
