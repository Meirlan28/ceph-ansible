---
# Bootstrap host: wait until the orchestrator has converged, then enable the dashboard.
- name: Expected OSD count
  ansible.builtin.set_fact:
    ceph_expected_osds: "{{ ceph_expected_osds_calc | int }}"
  vars:
    ceph_expected_osds_calc: >-
      {% set ns = namespace(n=0) %}{% for h in groups['osds'] %}{% set d = hostvars[h].ceph_osd_devices | default([]) | length %}{% set ns.n = ns.n + (d if d > 0 else 1) %}{% endfor %}{{ ns.n }}

- name: Wait for {{ groups['mons'] | length }} monitors in quorum
  ansible.builtin.command: "{{ ceph_shell }} ceph quorum_status --format json"
  register: quorum
  changed_when: false
  retries: "{{ ceph_wait_retries }}"
  delay: "{{ ceph_wait_delay }}"
  until: quorum.rc == 0 and (quorum.stdout | from_json).quorum_names | length == groups['mons'] | length

- name: Wait for {{ ceph_expected_osds }} OSDs up and in
  ansible.builtin.command: "{{ ceph_shell }} ceph osd stat --format json"
  register: osd_stat
  changed_when: false
  retries: "{{ ceph_wait_retries }}"
  delay: "{{ ceph_wait_delay }}"
  until: >-
    osd_stat.rc == 0
    and (osd_stat.stdout | from_json).num_up_osds | int >= ceph_expected_osds | int
    and (osd_stat.stdout | from_json).num_in_osds | int >= ceph_expected_osds | int

- name: Dashboard
  when: ceph_dashboard_enabled
  block:
    - name: Dashboard password file
      ansible.builtin.copy:
        content: "{{ ceph_dashboard_password }}"
        dest: "{{ ceph_workdir }}/dashboard.pass"
        mode: "0600"
      no_log: true
      changed_when: false   # transient, removed again below

    - name: Dashboard script
      ansible.builtin.template:
        src: dashboard.sh.j2
        dest: "{{ ceph_workdir }}/dashboard.sh"
        mode: "0600"

    - name: Enable dashboard and admin user
      ansible.builtin.command: "{{ ceph_shell }} bash /mnt/lab/dashboard.sh"
      register: dashboard
      changed_when: "'CHANGED' in dashboard.stdout"
      retries: 5
      delay: 10
      until: dashboard.rc == 0
  always:
    - name: Remove dashboard password file
      ansible.builtin.file:
        path: "{{ ceph_workdir }}/dashboard.pass"
        state: absent
      changed_when: false
