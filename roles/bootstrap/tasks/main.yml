---
# First mon only: create the cluster, then apply configuration needed before any OSD exists.
- name: Dashboard password supplied
  ansible.builtin.assert:
    that: ceph_dashboard_password is defined and ceph_dashboard_password | length >= 8
    fail_msg: "Set ceph_dashboard_password (>= 8 chars), e.g. -e ceph_dashboard_password=... or ansible-vault"
    quiet: true
  when: ceph_dashboard_enabled

- name: Work directory
  ansible.builtin.file:
    path: "{{ ceph_workdir }}"
    state: directory
    mode: "0700"

- name: Existing cluster on this host
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: ceph_conf

# The dashboard is enabled later with the password passed in a file (never on a command line).
- name: cephadm bootstrap
  ansible.builtin.command: >-
    cephadm --image {{ ceph_image }} bootstrap
    --mon-ip {{ ceph_public_ip }}
    {{ ('--cluster-network ' ~ ceph_cluster_network) if ceph_cluster_network else '' }}
    --skip-dashboard
    {{ '' if ceph_monitoring_stack else '--skip-monitoring-stack' }}
    --output-dir /etc/ceph
  when: not ceph_conf.stat.exists

- name: Configuration script
  ansible.builtin.template:
    src: config.sh.j2
    dest: "{{ ceph_workdir }}/config.sh"
    mode: "0600"

- name: Apply ceph config (idempotent)
  ansible.builtin.command: "{{ ceph_shell }} bash /mnt/lab/config.sh"
  register: config
  changed_when: "'CHANGED' in config.stdout"
