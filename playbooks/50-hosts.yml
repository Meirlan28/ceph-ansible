---
# Register every storage node with the orchestrator (address + labels). Labels drive placement in
# services/*.yml; _admin makes cephadm keep ceph.conf and the admin keyring on that host.
- name: Orchestrator hosts
  hosts: ceph
  become: true
  gather_facts: false
  tasks:
    - name: ceph orch host add {{ inventory_hostname }}
      ceph.cephadm.ceph_orch_host:
        name: "{{ inventory_hostname }}"
        address: "{{ ceph_ip }}"
        labels: "{{ ceph_labels }}"
        set_admin_label: "{{ inventory_hostname in groups['admin'] }}"
      delegate_to: "{{ admin_node }}"
      throttle: 1

- name: Hosts known to the orchestrator
  hosts: admin
  become: true
  gather_facts: false
  tasks:
    - name: ceph orch host ls
      ansible.builtin.command: ceph orch host ls
      register: hosts_out
      changed_when: false
      when: inventory_hostname == admin_node

    - name: Show hosts
      ansible.builtin.debug:
        var: hosts_out.stdout_lines
      when: inventory_hostname == admin_node
