---
# Role ceph_cluster on every storage node, after playbooks/10-preflight.yml.
# Whole cluster:        ansible-playbook playbooks/ceph.yml
# One phase (tags):     --tags ceph_time | ceph_bootstrap | ceph_ssh_key | ceph_hosts | ceph_services | ceph_pools | ceph_verify
- name: Ceph cluster
  hosts: ceph
  become: true
  # Cluster-wide steps depend on admin_node and on every host: if one fails, stop everything instead of
  # carrying on with a partial cluster (e.g. bootstrap skipped because admin_node already failed).
  any_errors_fatal: true
  roles:
    - role: ceph_cluster
