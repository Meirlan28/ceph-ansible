---
# Same time source for every Ceph host (mons allow 50 ms of drift). See ntp_* in group_vars.
- name: Cluster time synchronisation
  hosts: ceph
  become: true
  handlers:
    - name: Restart chronyd
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
  tasks:
    - name: chrony.conf
      ansible.builtin.template:
        src: ../templates/chrony.conf.j2
        dest: /etc/chrony.conf
        mode: "0644"
        backup: true
      notify: Restart chronyd

    - name: NTP open on the time server
      ansible.posix.firewalld:
        service: ntp
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname == ntp_server

    - name: Apply chrony changes now
      ansible.builtin.meta: flush_handlers

    - name: Wait until the clock is within 10 ms of its source
      ansible.builtin.command: chronyc waitsync 30 0.01
      changed_when: false

    - name: Offset
      ansible.builtin.command: chronyc tracking
      register: tracking
      changed_when: false

    - name: Show offset
      ansible.builtin.debug:
        msg: "{{ tracking.stdout_lines | select('search', 'Reference ID|System time') | list }}"
