---
# Create the cluster on admin_node: first mon + mgr, admin keyring in /etc/ceph, cephadm SSH key.
# Skipped automatically if /etc/ceph/ceph.conf already exists (module is idempotent).
- name: Bootstrap
  hosts: admin
  become: true
  gather_facts: false
  tasks:
    - name: Dashboard password is in the vault
      ansible.builtin.assert:
        that: vault_ceph_dashboard_password is defined and vault_ceph_dashboard_password | length >= 8
        fail_msg: >-
          Create inventory/lab/group_vars/all/vault.yml with ansible-vault (see docs/RUNBOOK.md, step 4)
          containing vault_ceph_dashboard_password (8+ characters), and run with --ask-vault-pass.
        quiet: true
      when: inventory_hostname == admin_node

    # cephadm-ansible v5.0.3: the module's own "already bootstrapped" check looks for
    # /var/lib/ceph/ceph.conf, but cephadm writes /etc/ceph/ceph.conf, so check here.
    - name: Existing cluster on this host
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: ceph_conf
      when: inventory_hostname == admin_node

    - name: cephadm bootstrap
      ceph.cephadm.cephadm_bootstrap:
        mon_ip: "{{ ceph_ip }}"
        image: "{{ ceph_image }}"
        ssh_user: "{{ cephadm_ssh_user }}"
        initial_dashboard_user: "{{ ceph_dashboard_user }}"
        initial_dashboard_password: "{{ ceph_dashboard_password }}"
        skip_monitoring_stack: true       # no Prometheus/Grafana/Alertmanager on 3 GB VMs
        cluster_network: "{{ ceph_cluster_network | default(omit, true) }}"
      no_log: true                        # the dashboard password is a module argument
      when: inventory_hostname == admin_node and not ceph_conf.stat.exists

    - name: Cluster status
      ansible.builtin.command: ceph -s
      register: status
      changed_when: false
      when: inventory_hostname == admin_node

    - name: Show status
      ansible.builtin.debug:
        var: status.stdout_lines
      when: inventory_hostname == admin_node
