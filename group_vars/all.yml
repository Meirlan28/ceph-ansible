---
# ---- Release ---------------------------------------------------------------------------------
# cephadm (RPM) and the container image must be the same release.
ceph_release: "20.2.4"                       # Tentacle, current stable
ceph_image: "quay.io/ceph/ceph:v{{ ceph_release }}"
ceph_repo_url: "https://download.ceph.com/rpm-{{ ceph_release }}/el{{ ansible_facts.distribution_major_version }}"
ceph_repo_gpgkey: "https://download.ceph.com/keys/release.asc"

# ---- Topology ----------------------------------------------------------------------------------
# Inventory groups: mons, mgrs, osds. The first mon bootstraps the cluster.
ceph_hosts: "{{ (groups['mons'] | default([])) | union(groups['mgrs'] | default([])) | union(groups['osds'] | default([])) }}"
ceph_bootstrap_host: "{{ groups['mons'][0] }}"
ceph_public_ip: "{{ ansible_host | default(inventory_hostname) }}"   # address Ceph daemons bind to
ceph_cluster_network: ""                     # optional separate replication network (CIDR)
ceph_mgr_count: 2
ceph_monitoring_stack: false                 # Prometheus/Grafana/Alertmanager: RAM hungry

# ---- Dashboard --------------------------------------------------------------------------------
ceph_dashboard_enabled: true
ceph_dashboard_user: admin
# ceph_dashboard_password: required when the dashboard is enabled; pass via -e / ansible-vault.
ceph_dashboard_reset_password: false         # true = overwrite the password of an existing user

# ---- OSDs ---------------------------------------------------------------------------------------
# Per host: list of stable device paths (/dev/disk/by-id/...). A host in 'osds' without devices
# uses every available (blank) disk when ceph_osd_auto is true; otherwise the play stops.
ceph_osd_devices: []
ceph_osd_auto: false

# ---- Configuration (ceph config set), applied before OSDs are created -------------------------
# Defaults fit small VMs (3 GB RAM per node running mon + mgr + osd).
ceph_config:
  - { who: osd, key: osd_memory_target_autotune, value: "false" }
  - { who: osd, key: osd_memory_target, value: "1073741824" }   # 1 GiB (minimum is 896 MiB)
  - { who: mon, key: mon_allow_pool_delete, value: "true" }
ceph_config_extra: []

# ---- Pools ----------------------------------------------------------------------------------------
ceph_pools:
  - { name: rbd, pg_num: 32, application: rbd }

# ---- Waiting --------------------------------------------------------------------------------------
ceph_wait_retries: 90
ceph_wait_delay: 10

# Working directory on the bootstrap host, mounted into `cephadm shell` as /mnt/lab.
ceph_workdir: /root/lab-ceph
ceph_shell: "cephadm shell --mount {{ ceph_workdir }}:/mnt/lab --"
