---
# Lab cluster (VMwareLab clusters/ceph). Names must equal the machines' hostnames: cephadm checks it.
# Groups used by cephadm-ansible: admin (holds the admin keyring; first one bootstraps), clients.
# Group "ceph" = every storage node; per-host ceph_labels decide which daemons run where.
all:
  children:
    ceph:
      hosts:
        ceph-1:
          ceph_ip: 192.168.228.21
          ceph_labels: [mon, mgr, osd]
        ceph-2:
          ceph_ip: 192.168.228.22
          ceph_labels: [mon, mgr, osd]
        ceph-3:
          ceph_ip: 192.168.228.23
          ceph_labels: [mon, osd]
        ceph-4:
          ceph_ip: 192.168.228.24
          ceph_labels: [osd]
    admin:
      hosts:
        ceph-1:
    clients:
      hosts: {}
