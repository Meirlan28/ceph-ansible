---
# Environment-specific values only; everything else has a default in roles/ceph_cluster/defaults/main.yml
# (NTP, waits, ...). Override any of them here. Desired cluster state (services, config, pools): inventory/lab/ceph/.

# ---- Access -------------------------------------------------------------------------------------
# Ansible and cephadm both log in as this user (passwordless sudo, provided by the OS/infra layer).
ansible_user: ceph-admin
ansible_become: true
cephadm_ssh_user: ceph-admin
admin_node: ceph-1                     # bootstrap host; also read by cephadm-ansible playbooks
# cephadm-ansible v5.0.3 purge playbook reads client_group, which only its preflight defines.
client_group: clients

# ---- Release (pin everything) -----------------------------------------------------------------------
# Package repo for preflight: https://download.ceph.com/rpm-<release>/el<major>/ (cephadm, ceph-common).
# The role derives the container image from it: quay.io/ceph/ceph:v<release>.
ceph_origin: community
ceph_release: "20.2.4"                 # Tentacle

# ---- Networks -----------------------------------------------------------------------------------
ceph_cluster_network: 192.168.230.0/24   # OSD replication (back) network: VMwareLab network "cluster" (VMnet2), eth2

# ---- Dashboard ----------------------------------------------------------------------------------
ceph_dashboard_user: admin
ceph_dashboard_password: "{{ vault_ceph_dashboard_password }}"   # group_vars/all/vault.yml (ansible-vault)

# ---- Time ---------------------------------------------------------------------------------------
# ceph-1 serves time to the whole public subnet, so new nodes need no change on ceph-1.
ntp_allow: [192.168.228.0/24]
