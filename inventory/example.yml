# Example inventory. The VMwareLab `lab.cmd deploy` generates an equivalent one automatically.
all:
  vars:
    ansible_user: vagrant
    ansible_become: true
  hosts:
    ceph-1: {ansible_host: 192.168.228.21, ceph_osd_devices: [/dev/disk/by-id/scsi-36000c29eb588cbd8fd7f24a709bd203e]}
    ceph-2: {ansible_host: 192.168.228.22, ceph_osd_devices: [/dev/disk/by-id/scsi-REPLACE]}
    ceph-3: {ansible_host: 192.168.228.23, ceph_osd_devices: [/dev/disk/by-id/scsi-REPLACE]}
  children:
    mons: {hosts: {ceph-1: , ceph-2: , ceph-3: }}
    mgrs: {hosts: {ceph-1: , ceph-2: , ceph-3: }}
    osds: {hosts: {ceph-1: , ceph-2: , ceph-3: }}
