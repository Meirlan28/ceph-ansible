[defaults]
inventory = inventory/lab/hosts.yml
collections_path = ./collections
# cephadm-ansible v5.0.3 modules still import their helpers as ansible.module_utils.ceph_common
# (pre-collection layout), so expose its module_utils the way its own ansible.cfg does.
module_utils = ./collections/ansible_collections/ceph/cephadm/plugins/module_utils
roles_path = ./roles
forks = 20
timeout = 60
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
log_path = ./ansible.log
# ansible-core >= 2.19 rejects non-boolean conditionals, and cephadm-ansible v5.0.3 has them
# (e.g. cephadm-purge-cluster.yml: `when: cephadm_exists.rc`). Allow them (with a deprecation
# warning) so the upstream playbooks work on any ansible-core; older versions ignore the key.
allow_broken_conditionals = True
deprecation_warnings=False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o StrictHostKeyChecking=accept-new
