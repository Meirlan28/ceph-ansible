[defaults]
inventory = inventory/lab/hosts.yml
collections_path = ./collections
# cephadm-ansible v5.0.3 modules still import their helpers as ansible.module_utils.ceph_common
# (pre-collection layout), so expose its module_utils the way its own ansible.cfg does.
module_utils = ./collections/ansible_collections/ceph/cephadm/plugins/module_utils
roles_path = ./roles
forks = 20
timeout = 60
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
log_path = ./ansible.log

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o StrictHostKeyChecking=accept-new
