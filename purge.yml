---
# Removes the Ceph cluster from all hosts and wipes OSD disks (DATA LOSS), so site.yml can start
# from scratch without recreating the machines. Requires -e confirm_purge=yes.
- name: Purge Ceph
  hosts: mons:mgrs:osds
  become: true
  tasks:
    - name: Confirmation
      ansible.builtin.assert:
        that: confirm_purge | default('') == 'yes'
        fail_msg: "This destroys the cluster and wipes OSD disks. Re-run with -e confirm_purge=yes"
        quiet: true
      run_once: true

    - name: Stop the orchestrator so it does not redeploy daemons during removal
      ansible.builtin.command: "cephadm shell -- ceph mgr module disable cephadm"
      when: inventory_hostname == ceph_bootstrap_host
      failed_when: false
      changed_when: true

    - name: Clusters present on this host
      ansible.builtin.find:
        paths: /var/lib/ceph
        file_type: directory
        patterns: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        use_regex: true
      register: fsids

    - name: cephadm rm-cluster --zap-osds
      ansible.builtin.command: "cephadm rm-cluster --force --zap-osds --fsid {{ item.path | basename }}"
      loop: "{{ fsids.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Remove leftover configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ceph
        - "{{ ceph_workdir }}"
