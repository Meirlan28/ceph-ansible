# OSDs: a "drive group". On every host labelled "osd", use each *available* disk (no partitions,
# no LVM, no filesystem), which in the lab is exactly the blank 10 GB data disk.
# Production clusters usually filter by hardware instead of taking everything, e.g.:
#   data_devices: {rotational: 1, size: '4T:'}   db_devices: {rotational: 0}
# Check candidates first with: ceph orch device ls  (and dry-run: ceph orch apply -i osd.yml --dry-run)
service_type: osd
service_id: default_drive_group
placement:
  label: osd
spec:
  data_devices:
    all: true
  # cephadm defaults, written out so the spec matches `ceph orch ls --export` (ceph_orch_apply
  # compares field by field; without them every run would report a change).
  filter_logic: AND
  objectstore: bluestore
